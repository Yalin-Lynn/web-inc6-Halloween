<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Haunted Harvest Halloween animated scene">
    <title>Haunted Harvest</title>

    <link rel="stylesheet" href="haunted-harvest.css">

<body>

    <header class="site-header">
        <h1>🎃 Haunted Harvest 🎃</h1>
        <p>A Haunted Halloween Town Square</p>
    </header>

    <main>
        <section class="scenes" aria-label="Halloween animated scenes">

            <section class="scene" id="town-square">
                <h2 class="scene-title">Haunted Halloween Town Square</h2>

                <div class="scene-stage"
                     role="img"
                     aria-label="A haunted Halloween town at night with a moon, haunted house, pumpkins, and animated Halloween characters.">

                    <!-- Yalin: Main environment -->
                    <div class="moon">🌕</div>

                    <div class="haunted-house" aria-label="Haunted house">
                        🏚️
                    </div>

                    <div class="pumpkin pumpkin-one pumpkin-glow">🎃</div>
                    <div class="pumpkin pumpkin-two pumpkin-glow">🎃</div>
                    <div class="pumpkin pumpkin-three pumpkin-glow">🎃</div>

                    <!-- Yunxue: Animated elements will be added here later -->

                    <div class="ground"></div>

                </div>
            </section>

        </section>
    </main>

    <footer class="site-footer">
        <p>Haunted Harvest | Yalin Zhang &amp; Yunxue Wu</p>
    </footer>

</body>
</html>
